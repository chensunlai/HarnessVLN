vln:
    factory: vln.dualvln:DualVLNNavigator
    scope: session
    params:
      command:
        - python
        - -m
        - vln.dualvln.worker
      upstream_root: cache/upstream/internnav
      checkpoint: model/dualvln
      cwd: .
      local_max_steps: 16
      env:
        PYTHONPATH: src
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
      worker_options:
        device: cuda:0
        max_steps: 1000
        depth_checkpoint: model/dualvln/depth_anything_v2_metric_hypersim_vits.pth
        model_settings:
          infer_mode: partial_async
          continuous_traj: true
          num_history: 8
          num_frames: 32
          num_future_steps: 4
      request_timeout_s: 1800
provenance:
  model: InternVLA-N1-DualVLN
  checkpoint: InternRobotics/InternVLA-N1-DualVLN
  checkpoint_revision: a698a9e898b4001621a319e1bc89f02ec715cc86
  depth_checkpoint_revision: 3bc65d4e14a6786a61acec16453c50e12bf5f338
  upstream_commit: 7a5c62400ac45b313d9b709c740b64191556a242
