vln:
    factory: vln.janusvln:JanusVLNNavigator
    scope: session
    params:
      command:
        - python
        - -m
        - vln.janusvln.worker
      upstream_root: cache/upstream/janusvln
      checkpoint: model/janusvln
      cwd: .
      local_max_steps: 16
      env:
        PYTHONPATH: src
      worker_options:
        device: cuda:0
        local_files_only: true
        max_steps: 400
        num_history: 8
      request_timeout_s: 900
provenance:
  model: JanusVLN_Base
  checkpoint: misstl/JanusVLN_Base
  checkpoint_revision: 33f932a4ea6bdc34afca9f5b79a8b4537cd02509
  upstream_commit: 8cfe3129f7af4ca276bd5e38f1fae7e5367a09ec
