vln:
    factory: vln.streamvln:StreamVLNNavigator
    scope: session
    params:
      command:
        - python
        - -m
        - vln.streamvln.worker
      upstream_root: cache/upstream/streamvln
      checkpoint: model/streamvln
      cwd: .
      local_max_steps: 16
      env:
        PYTHONPATH: src
      worker_options:
        tokenizer_path: model/qwen2.5-7b-tokenizer
        vision_tower_path: model/siglip-so400m-patch14-384
        device: cuda:0
        local_files_only: true
        max_steps: 500
        num_frames: 32
        num_history: 8
        num_future_steps: 4
      request_timeout_s: 900
