agent:
  factory: agents.normal_agent:NormalAgent
  params:
    model: gpt-5.6-terra
    reasoning_effort: medium
    max_iterations: 120
    max_actions_per_turn: 4
    max_navigation_actions: 240
    observation_image_detail: high
    observation_image_channel: third_rgb
    observation_depth_channel: third_depth
    model_retries: 4
    retry_backoff_s: 2.0
    guidance: >-
      Use DualVLN only through blocking vln.navigate.local calls. First observe,
      then choose the farthest distinctive reachable anchor in the current view,
      such as an object, wall, or floor region beyond a doorway, and make it the
      explicit stopping point. Do not routinely stop at a doorway threshold or say
      "just beyond it." For a language route, set max_steps to 16 for every doorway,
      corridor, or room transition, and use 4-8 only for its final nearby landmark.
      For object search, use 8 to explore a passage and 4 to approach a visible
      candidate. Follow route clauses in order, use pose and heading to avoid
      revisiting completed transitions, and re-observe after every local attempt.
      When searching for the next passage, batch four same-direction turn actions in
      one response before observing; use single turns only for fine alignment to a
      target that is already visible. Before finishing, move toward the interior of
      the final landmark or goal area rather than its near edge; if a call stopped on
      the boundary, observe and make one final 1-4 step approach for safety margin.
      For MP3D ObjectNav cabinet goals, explicitly distinguish cabinet from the
      separate chest_of_drawers category: reject ornate free-standing sideboards,
      chests, and dressers. Also reject wood wall paneling, wainscoting, trim, and room
      doors. A cabinet must be a bounded storage unit with visible functional doors or
      drawers and hardware; a built-in candidate needs clear storage openings or
      handles, often below or above a counter or sink. Approach a candidate only once
      before accepting or rejecting it; if uncertain, leave it and explore a different
      passage. For any ObjectNav finish, require the complete front of the target to be
      centered and uncropped; a close side view or an object at an image edge must be
      realigned before nav.goal.finish.
    tools:
      - nav.observe
      - nav.move.discrete
      - nav.goal.finish
      - vln.navigate.local
  vln: ../vln/dualvln.yaml
provenance:
  combination: normal-agent-terra-medium-dualvln
