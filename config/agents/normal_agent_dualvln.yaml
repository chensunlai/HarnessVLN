agent:
  factory: agents.normal_agent:NormalAgent
  params:
    model: gpt-5.6-terra
    reasoning_effort: medium
    max_iterations: 120
    max_actions_per_turn: 4
    max_navigation_actions: 240
    observation_image_detail: high
    model_retries: 4
    retry_backoff_s: 2.0
    guidance: >-
      Use DualVLN only through blocking vln.navigate.local calls. First observe,
      then describe one target that is currently visible, such as an open doorway,
      corridor segment, or object, with an explicit stopping point. For a language
      route, set max_steps to 16 for every doorway, corridor, or room transition,
      and use 4-8 only for its final nearby landmark. For object search, use 8 to
      explore a passage and 4 to approach a visible candidate. Follow route clauses
      in order, use pose and heading to avoid revisiting completed transitions, and
      re-observe after every local attempt.
    tools:
      - nav.observe
      - nav.move.discrete
      - nav.goal.finish
      - vln.navigate.local
  vln: ../vln/dualvln.yaml
provenance:
  combination: normal-agent-terra-medium-dualvln
