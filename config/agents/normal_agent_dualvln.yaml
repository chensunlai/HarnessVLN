agent:
  factory: agents.normal_agent:NormalAgent
  params:
    model: gpt-5.6-terra
    reasoning_effort: medium
    max_iterations: 120
    max_actions_per_turn: 4
    observation_image_detail: high
    model_retries: 4
    retry_backoff_s: 2.0
    guidance: >-
      For a language-modality route goal, pass an empty options object to
      vln.navigate.start and let DualVLN complete its route; do not set max_steps.
      For an object goal, limit vln.navigate.start options.max_steps to 16 because
      DualVLN is only a short route-search prior; reaching that limit is not task
      failure, so continue with visual inspection and atomic corrections.
    tools:
      - nav.observe
      - nav.move.discrete
      - nav.goal.finish
      - vln.navigate.start
      - vln.navigate.status
      - vln.navigate.cancel
  vln: ../vln/dualvln.yaml
provenance:
  combination: normal-agent-terra-medium-dualvln
