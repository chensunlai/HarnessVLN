agent:
  factory: agents.normal_agent:NormalAgent
  params:
    model: gpt-5.6-terra
    reasoning_effort: medium
    reasoning_summary: false
    commentary: false
    max_iterations: 120
    max_actions_per_turn: 4
    max_navigation_actions: 240
    observation_image_detail: high
    observation_image_channel: third_rgb
    observation_depth_channel: third_depth
    model_retries: 4
    retry_backoff_s: 2.0
    guidance: >-
      Use DualVLN only through blocking vln.navigate.local calls. First observe,
      then choose the farthest distinctive reachable anchor in the current view,
      such as an object, wall, or floor region beyond a doorway, and make it the
      explicit stopping point. Do not routinely stop at a doorway threshold or say
      "just beyond it." For a language route, set max_steps to 16 for every doorway,
      corridor, or room transition, and use 4-8 only for its final nearby landmark.
      For object search, use 8 to explore a passage and also for a candidate whose
      aligned depth cell is beyond about one meter or still needs alignment; use 4 only
      for the final approach to an already centered nearby candidate. Follow route
      clauses in order, use pose and heading to avoid revisiting completed transitions,
      and re-observe after every local attempt.
      When searching for the next passage, batch four same-direction turn actions in
      one response before observing. Use yaw to avoid re-inspecting directions and never
      repeat a circle at the same pose; choose a visible passage once useful headings
      have been checked. Use single turns only for fine alignment to a target that is
      already visible. Before finishing, move toward the interior of the final landmark
      or goal area rather than its near edge; if a call stopped on the boundary, observe
      and make one final 1-4 step approach for safety margin.
      ObjectNav categories follow dataset annotations and may include visually atypical
      instances, so do not impose a handcrafted material or part definition. Any valid
      instance of the requested category completes a category goal; never switch from
      one plausible instance to another instance of that category. Keep a plausible
      candidate active after its first fresh close view and continue short calls while
      each makes clear pose progress. From essentially the same pose, use at most two
      more calls to inspect, center, and approach it. Reject only a clear sibling
      category or architectural surface, and do not revisit a rejected candidate.
      Identify the object at the candidate center rather than its surrounding material;
      for example, an appliance framed by cabinet panels is still an appliance. For any
      ObjectNav finish, require the target to be centered, substantial, and uncropped;
      name the closest rejected alternative in the reason. A close side view or an
      object at an image edge must be realigned.
    tools:
      - nav.observe
      - nav.move.discrete
      - nav.goal.finish
      - vln.navigate.local
  vln: ../vln/dualvln.yaml
provenance:
  combination: normal-agent-terra-medium-dualvln
