module:
  name: agent_vln
  factory: modules.agent_vln:AgentVLNModule
  params:
    model: gpt-5.6-terra
    reasoning_effort: high
    max_iterations: 32
    max_actions: 80
    max_stationary_turns: 24
    image_memory: 8
    recent_images: 3
    image_detail: high
    minimum_travel_m: 4.5
    api_timeout_s: 180
    model_retries: 2
