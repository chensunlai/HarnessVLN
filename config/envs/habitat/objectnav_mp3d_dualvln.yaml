# @package _global_

defaults:
  - objectnav_mp3d
  - /habitat/simulator/sim_sensors@habitat.simulator.agents.main_agent.sim_sensors.third_rgb_sensor: third_rgb_sensor
  - /habitat/simulator/sim_sensors@habitat.simulator.agents.main_agent.sim_sensors.third_depth_sensor: third_depth_sensor
  - _self_

habitat:
  simulator:
    turn_angle: 15
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            orientation: [-0.5235987756, 0, 0]
          depth_sensor:
            orientation: [-0.5235987756, 0, 0]
          third_rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            orientation: [0, 0, 0]
          third_depth_sensor:
            width: 640
            height: 480
            hfov: 79
            orientation: [0, 0, 0]
            min_depth: 0.5
            max_depth: 5.0
            normalize_depth: true
