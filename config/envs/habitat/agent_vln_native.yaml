# @package _global_
defaults:
  - /benchmark/nav/vln_r2r
  - /habitat/task/lab_sensors:
      - gps_sensor
      - compass_sensor
  - _self_

habitat:
  environment:
    max_episode_steps: 160
  task:
    measurements:
      success:
        success_distance: 1.0
  dataset:
    split: debug
    data_path: data/generated/agent_vln_r2r_local_v2/{split}/{split}.json.gz
    scenes_dir: data/scene_datasets
  simulator:
    forward_step_size: 0.25
    turn_angle: 15
    habitat_sim_v0:
      gpu_device_id: 0
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor: {width: 640, height: 480, hfov: 79}
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.1
            max_depth: 10.0
            normalize_depth: false
