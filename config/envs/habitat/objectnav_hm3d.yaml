environment:
  factory: envs.habitat:HabitatEnvironment
  params:
    config_path: config/envs/habitat/objectnav_hm3d_native.yaml
    source_root: cache/upstream/habitat_lab
    scene_id_rewrites:
      data/scene_datasets/hm3d_v0.2/: data/scene_datasets/hm3d/
    native_actions:
      forward: 1
      turn_left: 2
      turn_right: 3
      look_up: 4
      look_down: 5
    terminal_action: 0
    observation_channels: [rgb, depth, gps, compass, objectgoal]
    main_camera_channel: rgb
    max_steps: 500
