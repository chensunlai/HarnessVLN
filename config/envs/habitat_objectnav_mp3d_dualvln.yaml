environment:
  factory: envs.habitat:from_episode
  params:
    native_factory: envs.habitat:create_native_session
    native_factory_params:
      config_path: config/envs/habitat/objectnav_mp3d_dualvln.yaml
      source_root: cache/upstream/habitat_lab
    native_actions:
      stand_still: null
      forward: 1
      turn_left: 2
      turn_right: 3
    goal_finish_action: 0
    observation_channels: [rgb, depth, gps, compass, objectgoal]
    static_channels:
      depth_metadata:
        encoding: linear_normalized
        minimum_m: 0.5
        maximum_m: 5.0
        lower_is_nearer: true
    expose_pose: true
    forward_m: 0.25
    turn_deg: 15.0
    camera:
      height: 480
      width: 640
      hfov_deg: 79
      pitch_deg: -30
provenance:
  simulator: Habitat-Lab/Sim 0.3.3
  simulator_commit: acbe6f4922e68145e401e55c30f9dfea460a3f24
  habitat_lab_commit: 094d6be2f9d057e4781a68ae792132895fd4d3d0
  sensor_profile: dualvln-look-down-30deg
